worker_processes auto;

events {
	worker_connections 1024;
}

http {
	proxy_cache_path /var/cache/nginx/frontend levels=1:2 keys_zone=frontend_cache:10m max_size=1g inactive=60m use_temp_path=off;
	proxy_cache_path /var/cache/nginx/backend levels=1:2 keys_zone=backend_cache:10m max_size=512m inactive=10m use_temp_path=off;

	# Default nginx upstream balancing algorithm is round robin
	upstream frontend_upstream {
		server frontend_1:8080;
		server frontend_2:8080;
	}

	upstream backend_upstream {
		server backend_1:5001;
		server backend_2:5001;
	}

	server {
		listen 8080;
		server_name _;

		location / {
			proxy_pass http://frontend_upstream;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;

			proxy_cache frontend_cache;
			proxy_cache_valid 200 302 10m;
			proxy_cache_valid 404 1m;
			proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
			proxy_cache_lock on;
			add_header X-Cache-Status $upstream_cache_status always;
		}
	}

	server {
		listen 5001;
		server_name _;

		location / {
			proxy_pass http://backend_upstream;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;

			# TIMEOUT LADDER - set EXPLICITLY, because the default proxy_read_timeout is 60s and
			# two endpoints legitimately need longer. When nginx gives up first it answers with
			# its own 504, which carries none of the backend's CORS headers, so the browser refuses
			# to let JS read it and reports a bare "Failed to fetch" - hiding the real status.
			# This value must stay ABOVE every backend budget and BELOW the browser abort:
			#
			#   career agent:  Gemini 45s / Ollama 100s  <  CAREER_AGENT_TOTAL_BUDGET_MS   120s
			#   resume parse:  Gemini 60s / Ollama rest  <  RESUME_PARSE_TOTAL_BUDGET_MS   110s
			#                                            <  150s here
			#                                            <  frontend DEFAULT_TIMEOUT_MS    180s
			#
			# so the innermost layer always fires first and the user gets a real error message
			# rather than a dead socket. Change one rung and re-check the rest - the resume parse
			# budget in particular was once 2 attempts x 140s = 280s, well over this ceiling, and
			# every résumé upload died here as an unreadable "Failed to fetch".
			proxy_connect_timeout 10s;
			proxy_send_timeout 150s;
			proxy_read_timeout 150s;

			# proxy_cache_methods defaults to GET/HEAD, so POST/PUT/PATCH/DELETE
			# calls (auth, mutations) always pass through untouched.
			proxy_cache backend_cache;
			proxy_cache_valid 200 1m;
			proxy_cache_bypass $http_cache_control;
			proxy_no_cache $http_authorization $cookie_session;
			proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
			add_header X-Cache-Status $upstream_cache_status always;
		}
	}
}
